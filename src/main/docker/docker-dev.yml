# Development container for live code editing.
# It does not build the application into the image. Source code is mounted from the host.
name: everycent-dev
services:
  dev:
    image: everycent-dev:latest
    build:
      context: ../../..
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    ports:
      - ${APP_PORT:-8080}:${APP_PORT:-8080}
      - 9000:9000
      - 9060:9060
      - 3001:3001
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8'
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS
      SPRING_PROFILES_ACTIVE: ${DEV_SPRING_PROFILES_ACTIVE:-dev,api-docs}
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SERVER_PORT: ${APP_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:?DB_HOST is required}:${DB_PORT:-3306}/${DB_NAME:-everycent}?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_LIQUIBASE_URL: jdbc:mysql://${DB_HOST:?DB_HOST is required}:${DB_PORT:-3306}/${DB_NAME:-everycent}?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_LIQUIBASE_USER: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_LIQUIBASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?JWT_BASE64_SECRET is required}
      JHIPSTER_MAIL_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_LLM_ENABLED: ${APP_LLM_ENABLED:-true}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-openai-compatible}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-qwen3.6-flash}
      APP_LLM_TIMEOUT_SECONDS: ${APP_LLM_TIMEOUT_SECONDS:-20}
      APP_LLM_MIN_CONFIDENCE: ${APP_LLM_MIN_CONFIDENCE:-0.70}
      APP_LLM_MAX_INPUT_LENGTH: ${APP_LLM_MAX_INPUT_LENGTH:-500}
      APP_EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER:-openai-compatible}
      APP_EMBEDDING_BASE_URL: ${APP_EMBEDDING_BASE_URL:-}
      APP_EMBEDDING_API_KEY: ${APP_EMBEDDING_API_KEY:-}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-v3}
      APP_EMBEDDING_DIMENSION: ${APP_EMBEDDING_DIMENSION:-1024}
      APP_EMBEDDING_TIMEOUT_SECONDS: ${APP_EMBEDDING_TIMEOUT_SECONDS:-20}
      APP_VECTOR_STORE_PROVIDER: ${APP_VECTOR_STORE_PROVIDER:-qdrant}
      APP_VECTOR_STORE_BASE_URL: ${DEV_VECTOR_STORE_BASE_URL:-http://host.docker.internal:6333}
      APP_VECTOR_STORE_MEMORY_COLLECTION: ${APP_VECTOR_STORE_MEMORY_COLLECTION:-everycent_ai_memory}
      APP_VECTOR_STORE_ROLE_KNOWLEDGE_COLLECTION: ${APP_VECTOR_STORE_ROLE_KNOWLEDGE_COLLECTION:-everycent_ai_role_knowledge}
      APP_VECTOR_STORE_TIMEOUT_SECONDS: ${APP_VECTOR_STORE_TIMEOUT_SECONDS:-10}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-1000}
      WATCHPACK_POLLING: 'true'
      WEBPACK_POLL_INTERVAL: ${WEBPACK_POLL_INTERVAL:-1000}
    volumes:
      - ../../..:/workspace
      - everycent-dev-maven-cache:/root/.m2
      - everycent-dev-node-modules:/workspace/node_modules
      - everycent-dev-target:/workspace/target
    stdin_open: true
    tty: true

volumes:
  everycent-dev-maven-cache:
  everycent-dev-node-modules:
  everycent-dev-target:
