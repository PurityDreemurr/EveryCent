# Qdrant vector database for EveryCent AI memory and role knowledge RAG.
name: everycent-vector
services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: everycent-qdrant
    ports:
      - ${QDRANT_HTTP_PORT:-6333}:6333
      - ${QDRANT_GRPC_PORT:-6334}:6334
    volumes:
      - everycent-qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ['CMD-SHELL', "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  qdrant-init:
    image: curlimages/curl:8.11.1
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      QDRANT_MEMORY_COLLECTION: ${QDRANT_MEMORY_COLLECTION:-everycent_ai_memory}
      QDRANT_ROLE_KNOWLEDGE_COLLECTION: ${QDRANT_ROLE_KNOWLEDGE_COLLECTION:-everycent_ai_role_knowledge}
    volumes:
      - ./qdrant/init-collections.sh:/init-collections.sh:ro
    command: ['/bin/sh', '/init-collections.sh']
    restart: 'no'

volumes:
  everycent-qdrant-storage:
